name: Performance budgets
on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  performance:
    name: Performance budgets
    runs-on: ubuntu-latest
    # The browser save checks alone take about eight minutes on a runner;
    # 10 cancelled passing runs at random. The budgets themselves are unchanged.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:performance
      - run: npx playwright install --with-deps chromium
      - run: npm run test:performance:browser
      - run: node tests/full-game-rendering-browser.mjs
      - run: node tests/local-save-browser.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-report
          path: artifacts/performance/
