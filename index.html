<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="theme-color" content="#0a0e14" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
    <title>Voxel Sandbox</title>
    <link rel="preload" href="/fonts/pixelify-sans-latin-700-normal.woff2" as="font" type="font/woff2" crossorigin>
    <style>
      /* The loading screen (src/ui/loading.js). Here rather than in the
         game's stylesheet so it's up the instant the page is, before a line
         of the game has arrived. */
      @font-face { font-family: 'Pixelify Sans'; font-weight: 700; font-display: block;
        src: url('/fonts/pixelify-sans-latin-700-normal.woff2') format('woff2'); }
      #loading {
        position: fixed; inset: 0; z-index: 100000; display: flex; align-items: center; justify-content: center;
        padding: 16px; font-family: 'Pixelify Sans', system-ui, sans-serif; font-weight: 700;
        background:
          linear-gradient(180deg, transparent 0 72%, #5aa53a 72% 75%, #2f6b23 75% 76%, #8a5a32 76% 100%),
          linear-gradient(180deg, #7fb9e6 0%, #add7f5 72%);
        transition: opacity 0.45s ease;
      }
      #loading.ld-gone { opacity: 0; pointer-events: none; }
      #loading .ld-card { width: 100%; max-width: 340px; text-align: center; }
      #loading .ld-logo {
        margin: 0 0 28px; font-size: 56px; line-height: 1; color: #f1c84b; letter-spacing: 0.04em; text-transform: uppercase;
        text-shadow: 4px 0 0 #2b1d12, -4px 0 0 #2b1d12, 0 4px 0 #2b1d12, 0 -4px 0 #2b1d12,
          4px 4px 0 #2b1d12, -4px -4px 0 #2b1d12, 4px -4px 0 #2b1d12, -4px 4px 0 #2b1d12, 0 10px 0 rgba(43, 29, 18, 0.55);
      }
      #loading .ld-bar {
        position: relative; height: 26px; padding: 4px; background: #4a2e19;
        box-shadow: 0 0 0 4px #2b1d12, 0 8px 0 4px rgba(43, 29, 18, 0.45);
      }
      #loading .ld-track { position: relative; height: 100%; background: #f4e7c5; overflow: hidden; }
      #loading .ld-fill {
        position: absolute; inset: 0 auto 0 0; width: 6%; overflow: hidden;
        background: repeating-linear-gradient(90deg, #5aa53a 0 12px, #4c9431 12px 24px);
        box-shadow: inset 0 -4px 0 #2f6b23; transition: width 0.35s steps(6);
      }
      /* A glint running along the bar: a transform, so it keeps moving even
         while the game is busy building the world and nothing else can. */
      #loading .ld-fill::after {
        content: ''; position: absolute; top: 0; bottom: 0; left: 0; width: 40px;
        background: rgba(255, 255, 255, 0.35); animation: ld-glint 1.1s linear infinite;
      }
      @keyframes ld-glint { from { transform: translateX(-40px); } to { transform: translateX(340px); } }
      #loading .ld-label {
        margin: 18px 0 0; font-size: 16px; color: #fff;
        text-shadow: 2px 2px 0 #2b1d12, -1px -1px 0 #2b1d12, 1px -1px 0 #2b1d12, -1px 1px 0 #2b1d12;
      }
      @media (prefers-reduced-motion: reduce) { #loading .ld-fill::after { animation: none; display: none; } }
    </style>
  </head>
  <body>
    <div id="loading" role="progressbar" aria-label="Loading" aria-valuemin="0" aria-valuemax="100" aria-valuenow="6">
      <div class="ld-card">
        <h1 class="ld-logo">Duilt</h1>
        <div class="ld-bar"><div class="ld-track"><div class="ld-fill"></div></div></div>
        <p class="ld-label">Loading the game…</p>
      </div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
